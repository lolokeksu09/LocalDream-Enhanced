name: Android Kotlin compile

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-kotlin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile basic debug Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android string resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/res/values/strings.xml")
          root = ET.parse(path).getroot()
          names = [
              item.attrib["name"]
              for item in root
              if item.tag in {"string", "plurals", "string-array", "integer-array"}
              and "name" in item.attrib
          ]
          duplicates = sorted({name for name in names if names.count(name) > 1})
          if duplicates:
              raise SystemExit(f"Duplicate resource names: {duplicates}")
          print(f"Valid XML; {len(names)} named resources; no duplicates.")
          PY

      - name: Compile Kotlin sources
        run: ./gradlew --no-daemon :app:compileBasicDebugKotlin
