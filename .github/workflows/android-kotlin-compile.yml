name: LocalDream preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localdream-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android string resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/res/values/strings.xml")
          root = ET.parse(path).getroot()
          names = [
              item.attrib["name"]
              for item in root
              if item.tag in {"string", "plurals", "string-array", "integer-array"}
              and "name" in item.attrib
          ]
          duplicates = sorted({name for name in names if names.count(name) > 1})
          if duplicates:
              raise SystemExit(f"Duplicate resource names: {duplicates}")
          print(f"Valid XML; {len(names)} named resources; no duplicates.")
          PY
